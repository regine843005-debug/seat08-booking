<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="第八個座位 SEAT 08｜商業交流餐會・同頻餐桌會・就愛吃火鍋 預約包場">
<title>第八個座位｜SEAT 08</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700;900&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#1F4A33;
    --green-deep:#143424;
    --paper:#F7EEDC;
    --paper-light:#FCF7EC;
    --blush:#F1DCD3;
    --gold:#B8955A;
    --gold-soft:#D9C49B;
    --ink:#2B2A24;
    --ink-soft:#6E6656;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse 80% 40% at 50% 100%, var(--blush), transparent 70%),
      linear-gradient(to bottom, var(--paper) 0%, var(--paper) 55%, #F4E4D8 100%);
    color:var(--ink);
    font-family:"Noto Serif TC", serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ── 標題區：墨綠 ── */
  .top{
    background:
      radial-gradient(ellipse at 50% -20%, #2F6548, transparent 70%),
      var(--green-deep);
    padding:22px 16px 22px;
    position:relative;
  }
  .top::after{ /* 底部雙金線 */
    content:"";
    position:absolute;left:0;right:0;bottom:-7px;height:4px;
    border-top:1px solid var(--gold);
    border-bottom:1px solid var(--gold);
  }
  .plaque{
    max-width:330px;margin:0 auto;
    background:var(--paper-light);
    padding:14px 18px;
    border:1px solid var(--gold);
    outline:1px solid var(--gold-soft);
    outline-offset:-6px;
  }
  .plaque img{display:block;width:100%;height:auto;}

  /* ── 主體 ── */
  .wrap{max-width:480px;margin:0 auto;padding:40px 20px 30px;}

  .heading{
    text-align:center;
    margin-bottom:26px;
  }
  .heading .en{
    font-family:"Cormorant Garamond", serif;
    font-size:13px;
    letter-spacing:0.45em;
    color:var(--gold);
    padding-left:0.45em;
  }
  .heading h1{
    margin-top:6px;
    font-size:20px;
    font-weight:700;
    letter-spacing:0.35em;
    padding-left:0.35em;
    color:var(--green);
  }
  .ornament{
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin-top:12px;color:var(--gold);font-size:9px;
  }
  .ornament::before,.ornament::after{
    content:"";width:54px;height:1px;background:var(--gold);
  }

  /* ── 三張卡：一直線往下 ── */
  .menu{display:flex;flex-direction:column;align-items:center;gap:26px;}
  .card{
    width:min(76vw, 300px);
    display:block;
    text-decoration:none;
    background:var(--paper-light);
    padding:8px 8px 0;
    border:1px solid var(--gold-soft);
    box-shadow:0 1px 0 var(--gold-soft), 0 16px 28px -18px rgba(43,42,36,0.55);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .card:active{transform:translateY(2px) scale(0.985);}
  .card img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;}
  .card .cta{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 6px 13px;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.18em;
    color:var(--green);
  }
  .card .no{
    font-family:"Cormorant Garamond", serif;
    font-size:14px;
    letter-spacing:0.15em;
    color:var(--gold);
    font-weight:600;
  }
  .card .arrow{
    width:26px;height:26px;border-radius:50%;
    border:1px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;color:var(--gold);letter-spacing:0;
  }

  /* ── 頁尾 ── */
  footer{
    margin:44px auto 0;
    max-width:300px;
    text-align:center;
    padding-top:20px;
    border-top:1px solid var(--gold-soft);
    font-size:12px;
    line-height:2;
    letter-spacing:0.12em;
    color:var(--ink-soft);
  }
  footer .co{font-size:14px;font-weight:700;color:var(--green);letter-spacing:0.15em;}
  footer a{color:inherit;text-decoration:none;}
  footer .en{
    margin-top:10px;
    font-family:"Cormorant Garamond", serif;
    font-size:11px;letter-spacing:0.4em;color:var(--gold);
  }
</style>
</head>
<body>

<div class="top">
  <div class="plaque">
    <img src="images/logo.png" alt="第八個座位 SEAT 08">
  </div>
</div>

<main class="wrap">

  <div class="heading">
    <div class="en">THE EIGHTH SEAT</div>
    <h1>三種餐桌</h1>
    <div class="ornament">◆</div>
  </div>

  <nav class="menu">
    <a class="card" href="https://liff.line.me/2011023659-9wH5wZ0v">
      <img src="images/business.jpg" alt="商業交流餐會">
      <span class="cta"><span class="no">I</span>點選看內容<span class="arrow">→</span></span>
    </a>
    <a class="card" href="https://liff.line.me/2011023659-akfCqF26">
      <img src="images/resonance.jpg" alt="同頻餐桌會">
      <span class="cta"><span class="no">II</span>點選看內容<span class="arrow">→</span></span>
    </a>
    <a class="card" href="https://liff.line.me/2011023659-lpKqmXIF">
      <img src="images/hotpot.jpg" alt="就愛吃火鍋 預約包場">
      <span class="cta"><span class="no">III</span>點選看內容<span class="arrow">→</span></span>
    </a>
    <a class="card" href="survey/">
      <img src="images/survey.jpg" alt="參加者滿意度調查：感謝入座・留下回饋">
      <span class="cta"><span class="no">IV</span>點選填寫<span class="arrow">→</span></span>
    </a>
    <a class="card" href="https://yaoliching.github.io/idream-shop/" target="_blank" rel="noopener">
      <img src="images/hotpot-home.jpg" alt="想要把火鍋帶回家：姚家老火慢淬雞湯">
      <span class="cta"><span class="no">V</span>想要把火鍋帶回家<span class="arrow">→</span></span>
    </a>
    <a class="card" href="https://yaoliching.github.io/idream-shop/" target="_blank" rel="noopener">
      <img src="images/ambassador-square.svg" alt="我想擔任鍋物推薦大使">
      <span class="cta"><span class="no">VI</span>我想擔任鍋物推薦大使<span class="arrow">→</span></span>
    </a>
  </nav>


  <footer>
    <div class="co">好放心飲食行銷有限公司</div>
    <div>電話 <a href="tel:0920090616">0920-090-616</a></div>
    <div>統一編號 60703839</div>
    <div class="en">SEAT 08</div>
  </footer>

</main>

</body>
</html>
