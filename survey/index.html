adding:8px 14px;font-weight:600;font-size:14px;margin:0;cursor:pointer;background:#fffefa}.mode-opt input{width:auto;margin:0;accent-color:var(--terracotta)}.mode-opt:has(input:checked){border-color:var(--terracotta);background:#fbefe9}.pair-box{border:1px dashed #d9c3b3;border-radius:12px;padding:14px 14px 6px;margin:-4px 0 17px;background:#fffaf5}.pair-box b{display:block;font-size:14px;margin-bottom:10px}.pair-box .hint{margin:0 0 10px}.fee{margin:0 0 20px;padding:14px 16px;border-radius:12px;background:#f4e2d4;color:var(--terracotta-dark);font-size:14px;line-height:1.7}.fee strong{font-size:20px}.dates{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.date-opt{display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);border-radius:8px;padding:6px 4px;font-weight:600;font-size:13px;line-height:1.3;margin:0;cursor:pointer;background:#fffefa;transition:.15s;white-space:nowrap}.date-opt input{width:auto;margin:0;flex:none;accent-color:var(--terracotta)}.date-opt:has(input:checked){border-color:var(--terracotta);background:#fbefe9}.date-opt.gift{border-color:#e0b98a}.gift-note{margin:8px 0 0;color:var(--terracotta-dark);font-weight:600}.error{display:none;margin-top:15px;padding:14px;border-radius:10px;background:#fbe9e4;color:#8f4434;font-size:14px}.error.show{display:block}.submit[disabled]{opacity:.6;cursor:wait;transform:none}.line-hello{display:none;margin:0 0 18px;padding:10px 14px;border-radius:10px;background:#e8efe4;color:#4f6a4b;font-size:13px}.line-hello.show{display:block}
    footer{background:#312c27;color:#f8eee1;padding:29px 28px}.foot{max-width:1164px;margin:auto;display:flex;justify-content:space-between;gap:18px;font-size:13px}.foot span{color:#cbbcae}.foot a{color:#f8eee1}
    @media(max-width:820px){.hero{grid-template-columns:1fr;gap:40px;padding:36px 20px 70px}.topbar{padding:16px 20px}.nav{gap:12px}.flow{overflow:auto;justify-content:flex-start;padding:18px 20px}.flow-arrow{display:none}.flow-item{white-space:nowrap}.section{padding:76px 20px}.vcp-grid{grid-template-columns:1fr}.method .section,.form-layout{grid-template-columns:1fr;gap:30px}.form-layout{padding:76px 20px 86px}.foot{flex-direction:column}.row{grid-template-columns:1fr;gap:0}}
    @media(max-width:480px){.hero h1{font-size:55px}.hero-copy{font-size:16px}.brand img{height:50px}.nav{display:none}.poster:before{inset:12px -8px -8px 12px}form{padding:25px 19px}}
      html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
    @media(max-width:820px){.flow{flex-wrap:wrap;overflow:visible;gap:10px 18px}.flow-item{white-space:normal}}
    @media(max-width:480px){.flow{display:grid;grid-template-columns:1fr;gap:8px;padding:16px 20px}.hero h1{font-size:clamp(40px,13vw,55px)}.section-head h2,.form-intro h2{font-size:clamp(30px,9vw,40px);word-break:break-word}input,select,textarea{font-size:16px}input::placeholder,textarea::placeholder{font-size:14px}select{text-overflow:ellipsis}.dates{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}.date-opt{white-space:normal;padding:7px 4px}.vcp small{position:static;display:block;text-align:right;margin-top:10px}.vcp{min-height:0}.method-card{flex-direction:column;gap:4px}}
    .ph-hint{display:block;color:var(--muted);font-size:12px;margin-top:4px}
  
    .radios{display:flex;flex-wrap:wrap;gap:8px}.radios .mode-opt{font-weight:600}
    .cond{display:none}.cond.show{display:block}
    .think{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.think .method-card b{font-size:21px}
    @media(max-width:820px){.think{grid-template-columns:1fr}}

    .sv{max-width:620px;margin:auto;padding:22px 16px 60px}.sv-head{text-align:center;margin:8px 0 18px}.sv-head img{width:100%;max-width:420px;border-radius:16px;box-shadow:var(--shadow)}
    .q{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;margin:0 0 12px}.q>label,.q .qt{display:block;font-weight:800;font-size:15px;margin:0 0 10px}.q .qt b{color:var(--terracotta);margin-right:6px}
    .chips{display:flex;flex-wrap:wrap;gap:8px}.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;margin:0;cursor:pointer;background:#fffefa}.chip input{width:auto;margin:0;accent-color:var(--terracotta)}.chip:has(input:checked){border-color:var(--terracotta);background:#fbefe9}
    .stars{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:4px}.stars input{display:none}.stars label{font-size:34px;line-height:1;color:#e3d6c6;cursor:pointer;margin:0}.stars input:checked~label,.stars label:hover,.stars label:hover~label{color:#e3a63a}
    .note{font-size:12px;color:var(--muted);font-weight:400;margin-top:6px;display:block}.muted-chip{opacity:.8}

<body>
<div class="wrap">
<main class="sv">
  <div class="sv-head"><img src="../images/survey.jpg" alt="參加者滿意度調查：感謝入座・留下回饋"></div>
  <form id="sv">
    <div class="q"><span class="qt"><b>1</b>今天參加的是 <span class="req">*</span></span>
      <div class="ev-pick chips"><label class="chip"><input type="radio" name="eventId" value="seat08_business" required>商業交流餐會</label><label class="chip"><input type="radio" name="eventId" value="seat08_resonance">同頻餐桌會</label></div>
      <div class="row" style="margin-top:12px"><div class="field" style="margin:0"><label for="date" style="font-size:13px">場次日期</label><input id="date" type="date" required></div></div>
      <div style="margin-top:12px"><label for="name" style="font-size:13px;font-weight:800;display:block;margin-bottom:6px">你的姓名 <span class="req">*</span></label><input id="name" name="name" required autocomplete="name" placeholder="例如：王小明"></div></div>
    <div class="q"><span class="qt"><b>2</b>今天的整體滿意度 <span class="req">*</span></span><div class="stars" data-name="overall"></div></div>
    <div class="q"><span class="qt"><b>3</b>今天跟誰交流最多？</span><input name="talkedMost" placeholder="請填寫對方姓名"></div>
    <div class="q"><span class="qt"><b>4</b>會後最想再跟誰深入交流？（可填多位）</span><input name="followUp" placeholder="請填寫對方姓名，多位請用頓號分開">
      <span class="note" style="margin:10px 0 6px">想聊什麼？</span><div class="chips" data-name="followTopic" data-type="checkbox" data-opts="談合作|轉介紹|請教專業|交個朋友"></div></div>
    <div class="q"><span class="qt"><b>5</b>對哪些交流主題有興趣？（可複選）</span><div class="chips" data-name="topics" data-type="checkbox" data-opts="品牌行銷|合作與轉介紹|創業經驗|財務資金|健康養生|親子教育|飲食與料理|其他"></div></div>
    <div class="q"><span class="qt"><b>6</b>今天交流起來最不順暢的是？（選填）</span><input name="notSmooth" placeholder="請填寫對方姓名，沒有可留空"><span class="note">只有主辦人看得到，用來調整下次的座位安排。</span></div>
    <div class="q"><span class="qt"><b>7</b>餐點滿意度 <span class="req">*</span></span><div class="stars" data-name="food"></div></div>
    <div class="q"><span class="qt"><b>8</b>精油老師滿意度</span><div class="stars" data-name="oil"></div><label class="chip muted-chip" style="margin-top:8px;display:inline-flex"><input type="checkbox" id="noOil">本場沒有精油老師</label></div>
    <div class="q"><span class="qt"><b>9</b>主持人滿意度 <span class="req">*</span></span><div class="stars" data-name="host"></div></div>
    <div class="q"><label for="advice"><b style="color:var(--terracotta);margin-right:6px">10</b>想對主辦人說的話或建議</label><textarea id="advice" name="advice" placeholder="任何想法都歡迎（選填）"></textarea></div>
    <button class="btn primary submit" type="submit" style="width:100%">送出 <span>→</span></button>
    <div class="success" role="status"></div><div class="error" role="alert"></div>
  </form>
  <p style="text-align:center;font-size:13px;color:var(--muted);margin-top:22px"><a href="../">← 第八個座位首頁</a>・官方 LINE <a href="https://line.me/R/ti/p/@413vjwfv">@413vjwfv</a></p>
</main>
</div>
<script>
  const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbx_31iRDeK7epsn7YNlY3TQV4Ty_S5G2z2cVmy_7aUhCufJV8Jm96j0tehcjCx-BPEs/exec';
  const form = document.getElementById('sv');
  const qs = new URLSearchParams(location.search);
  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // 星等
  document.querySelectorAll('.stars').forEach(box => {
    const n = box.dataset.name;
    for (let i = 5; i >= 1; i--) box.insertAdjacentHTML('beforeend', '<input type="radio" id="' + n + i + '" name="' + n + '" value="' + i + '"><label for="' + n + i + '" title="' + i + ' 顆星">★</label>');
  });
  // 固定選項
  function fillChips(box, opts) {
    const t = box.dataset.type, n = box.dataset.name;
    box.innerHTML = opts.map(o => '<label class="chip"><input type="' + t + '" name="' + n + '" value="' + esc(o) + '">' + esc(o) + '</label>').join('');
  }
  document.querySelectorAll('.chips[data-opts]').forEach(b => fillChips(b, b.dataset.opts.split('|')));

  // 預設：網址參數或今天
  const ev = qs.get('e') === 'business' ? 'seat08_business' : qs.get('e') === 'resonance' ? 'seat08_resonance' : '';
  if (ev) form.querySelector('input[name=eventId][value=' + ev + ']').checked = true;
  document.getElementById('date').value = qs.get('d') || iso(new Date());

  form.addEventListener('change', e => {
    if (e.target.id === 'noOil') form.querySelectorAll('input[name=oil]').forEach(i => { i.checked = false; i.disabled = e.target.checked; });
  });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const ok = form.querySelector('.success'), err = form.querySelector('.error'), btn = form.querySelector('.submit');
    ok.classList.remove('show'); err.classList.remove('show');
    const need = [['overall', '整體滿意度'], ['food', '餐點滿意度'], ['host', '主持人滿意度']].filter(([n]) => !form.querySelector('input[name=' + n + ']:checked'));
    if (need.length) { err.textContent = '請為「' + need.map(x => x[1]).join('、') + '」選擇星等。'; err.classList.add('show'); return; }
    const fd = new FormData(form); const all = k => fd.getAll(k).join('、');
    const [y, m, d] = document.getElementById('date').value.split('-').map(Number);
    const payload = {
      action: 'seat08Survey', eventId: fd.get('eventId'), date: y + '/' + m + '/' + d,
      name: (fd.get('name') || '').trim(),
      overall: fd.get('overall'), talkedMost: (fd.get('talkedMost') || '').trim(), followUp: (fd.get('followUp') || '').trim(), followTopic: all('followTopic'),
      topics: all('topics'), notSmooth: (fd.get('notSmooth') || '').trim(), food: fd.get('food'),
      oil: document.getElementById('noOil').checked ? '本場沒有' : (fd.get('oil') || ''), host: fd.get('host'), advice: fd.get('advice') || '',
    };
    btn.disabled = true; const t = btn.innerHTML; btn.innerHTML = '送出中…';
    try {
      const r = await fetch(WEBAPP_URL, { method: 'POST', body: JSON.stringify(payload) }).then(x => x.json());
      if (!r.ok) throw new Error(r.error || '送出失敗');
      form.querySelectorAll('.q').forEach(q => q.style.display = 'none'); btn.style.display = 'none';
      ok.innerHTML = '<b>謝謝你的回饋！</b><br>期待下次在餐桌上再見。'; ok.classList.add('show'); window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (x) { err.textContent = '送出沒有成功：' + x.message + '，請再試一次。'; err.classList.add('show'); }
    finally { btn.disabled = false; btn.innerHTML = t; }
  });
</script>
</body>
</html>
